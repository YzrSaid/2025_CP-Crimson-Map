<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Phone Example</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f5f5f5;
    position: relative;
    overflow: hidden;
    font-family: sans-serif;
  }
  /* Floating blob shapes behind the phone */
  .shape {
    position: absolute;
    z-index: 1;
  }
  .shape1 {
    width: 280px;
    height: 280px;
    background-color: #d4f7d4;
    top: 20%;
    left: 20%;
    border-radius: 45% 55% 52% 48% / 58% 44% 56% 42%;
  }
  .shape2 {
    width: 180px;
    height: 180px;
    background-color: #e8f9e8;
    top: 15%;
    left: 15%;
    border-radius: 52% 48% 43% 57% / 49% 61% 39% 51%;
  }
  .shape3 {
    width: 420px;
    height: 380px;
    background-color: #c8eec8;
    bottom: 8%;
    right: 10%;
    border-radius: 38% 62% 51% 49% / 43% 48% 52% 57%;
  }
  .shape4 {
    width: 200px;
    height: 200px;
    background-color: #daf5da;
    bottom: 20%;
    left: 10%;
    border-radius: 61% 39% 48% 52% / 55% 47% 53% 45%;
  }
  
  /* Phone container */
  .phone-container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .phone {
    width: 280px;
  }
</style>
</head>
<body>
<!-- Background shapes -->
<div class="shape shape1"></div>
<div class="shape shape2"></div>
<div class="shape shape3"></div>
<div class="shape shape4"></div>
<!-- Phone -->
<div class="phone-container">
  <img src="/assets/imgs/phone.png" alt="Phone" class="phone">
</div>
</body>
</html>
