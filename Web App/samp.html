<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Indoor Infrastructure</title>
<style>
  body { font-family: Arial, sans-serif; background:#f9f9f9; margin:0; padding:2rem; }
  h1 { color:#a3001e; text-align:center; }
  form { background:#fff; padding:2rem; border-radius:12px; max-width:600px; margin:auto; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
  .input-block { border:1px solid #ccc; padding:1rem; border-radius:8px; margin-bottom:1rem; }
  .form-group { margin-bottom:0.5rem; }
  label { display:block; margin-bottom:0.3rem; font-weight:bold; }
  input, select { width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; }
  button { padding:0.5rem 1rem; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
  .save-btn { background:#a3001e; color:#fff; margin-top:1rem; }
  .cancel-btn { background:#ccc; color:#000; margin-left:1rem; margin-top:1rem; }
  .add-btn { background:#f5c542; color:#000; border-radius:6px; padding:0.3rem 0.8rem; font-weight:bold; cursor:pointer; margin-bottom:1rem; display:block; }
  .spinner { border:3px solid #f3f3f3; border-top:3px solid #a3001e; border-radius:50%; width:18px; height:18px; animation: spin 1s linear infinite; display:inline-block; vertical-align:middle; margin-right:5px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>Add Indoor Infrastructure</h1>

<form id="addRoomForm">
  <button type="button" class="add-btn" id="addBlockBtn">+ Add Another Indoor Infrastructure</button>
  <div id="inputContainer"></div>
  <button type="submit" class="save-btn">Save All</button>
  <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
</form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, addDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";
import { firebaseConfig } from "../firebaseConfig.js";

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let categoriesMap = {};

// Fetch categories once
async function fetchCategories() {
  const categoriesSnapshot = await getDocs(collection(db, "Categories"));
  categoriesSnapshot.forEach(doc => {
    const cat = doc.data();
    if (cat.category_id && cat.name) categoriesMap[cat.category_id] = cat.name;
  });
}

// Generate next Room ID
async function generateNextRoomId() {
  const q = query(collection(db, "IndoorInfrastructure"));
  const snapshot = await getDocs(q);
  let maxNum = 0;
  snapshot.forEach(doc => {
    const data = doc.data();
    if (data.room_id) {
      const num = parseInt(data.room_id.replace(/^RM-|^IND-/, ""));
      if (!isNaN(num) && num > maxNum) maxNum = num;
    }
  });
  return maxNum + 1;
}

// Populate Infrastructure dropdown
async function createInfraSelect() {
  const select = document.createElement("select");
  select.required = true;
  select.innerHTML = `<option value="">Select an infrastructure</option>`;

  const infraSnapshot = await getDocs(query(collection(db, "Infrastructure"), orderBy("createdAt", "asc")));
  infraSnapshot.forEach(doc => {
    const data = doc.data();
    const categoryName = categoriesMap[data.category_id] || null;
    if (data.infra_id && data.name && (categoryName === "Academics" || categoryName === "Administration Offices")) {
      const option = document.createElement("option");
      option.value = data.infra_id;
      option.textContent = data.name;
      option.dataset.name = data.name;
      option.dataset.category = categoryName;
      select.appendChild(option);
    }
  });

  return select;
}

// Add new input block
async function addInputBlock() {
  const nextNum = await generateNextRoomId();
  const roomId = `IND-${String(nextNum).padStart(3, "0")}`;

  const container = document.getElementById("inputContainer");
  const block = document.createElement("div");
  block.className = "input-block";

  block.innerHTML = `
    <div class="form-group">
      <label>Indoor Infra Name</label>
      <input type="text" placeholder="e.g. Lecture Room 1" required>
    </div>
    <div class="form-group">
      <label>Indoor Infra ID</label>
      <input type="text" name="room_id" value="${roomId}" disabled>
    </div>
    <div class="form-group">
      <label>Infrastructure</label>
    </div>
    <div class="form-group">
      <label>Indoor Type</label>
      <select required>
        <option value="">Select type</option>
        <option value="room">Room</option>
        <option value="stairs">Stairs</option>
        <option value="fire_exit">Fire Exit</option>
        <option value="entrance">Entrance</option>
        <option value="indoorinter">Indoor Intermediate</option>
      </select>
    </div>
  `;

  const infraSelect = await createInfraSelect();
  block.querySelectorAll(".form-group")[2].appendChild(infraSelect);
  container.appendChild(block);
}

// Initialize
await fetchCategories();
await addInputBlock();

// Add block button
document.getElementById("addBlockBtn").addEventListener("click", addInputBlock);

// Form submission
document.getElementById("addRoomForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const saveBtn = e.target.querySelector(".save-btn");
  const originalHTML = saveBtn.innerHTML;
  saveBtn.innerHTML = `<div class="spinner"></div>Saving...`;
  saveBtn.disabled = true;

  const blocks = document.querySelectorAll(".input-block");
  try {
    for (const block of blocks) {
      const name = block.querySelector('input[placeholder]').value.trim();
      const roomId = block.querySelector('input[name="room_id"]').value.trim();
      const infraSelect = block.querySelectorAll("select")[0];
      const infraId = infraSelect.value;
      const infraName = infraSelect.selectedOptions[0]?.dataset.name || infraId;
      const indoorType = block.querySelectorAll("select")[1].value;

      if (!name || !roomId || !infraId || !indoorType) {
        alert("Please fill all fields in all blocks.");
        saveBtn.innerHTML = originalHTML;
        saveBtn.disabled = false;
        return;
      }

      await addDoc(collection(db, "IndoorInfrastructure"), {
        room_id: roomId,
        name: name,
        infra_id: infraId,
        indoor_type: indoorType,
        is_deleted: false,
        createdAt: new Date()
      });

      await updateDoc(doc(db, "StaticDataVersions", "GlobalInfo"), { indoor_infrastructure_updated: true });

      await addDoc(collection(db, "ActivityLogs"), {
        timestamp: new Date(),
        activity: "Added Indoor Infrastructure",
        item: `Indoor ${roomId}`,
        description: `Added "${name}" under infrastructure "${infraName}" (Type: ${indoorType}).`
      });
    }

    alert("All indoor infrastructures saved successfully!");
    document.getElementById("inputContainer").innerHTML = "";
    await addInputBlock();

  } catch (err) {
    console.error(err);
    alert("Error saving data. Please try again.");
  } finally {
    saveBtn.innerHTML = originalHTML;
    saveBtn.disabled = false;
  }
});

// Cancel button
document.getElementById("cancelBtn").addEventListener("click", () => {
  document.getElementById("inputContainer").innerHTML = "";
  addInputBlock();
});
</script>
</body>
</html>
